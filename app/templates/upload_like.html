<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select File</title>
</head>
<body>
    <h1>Auto-Like Songs</h1>
    <form action="/process_like" method="post" enctype="multipart/form-data">
        <label for="file">Select the .txt file:</label>
        <input type="file" id="file" name="file" accept=".txt" required><br><br>
        <button type="submit">Process</button>
    </form>
</body>
</html>
